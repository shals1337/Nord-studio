<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, follow" />
  <title>404 · Nordcode</title>
  <meta name="theme-color" content="#15120e" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/styles.css" />
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='16' fill='%2315120e'/%3E%3Cpath d='M30 72V28h8l24 30V28h8v44h-8L38 42v30z' fill='%23d38b4f'/%3E%3C/svg%3E" />
  <style>
    .nf { min-height: 100vh; display: grid; place-items: center; text-align: center; padding: 2rem; }
    .nf-inner { max-width: 460px; }
    .nf-code { font-weight: 600; font-size: clamp(4rem, 18vw, 8rem); line-height: 1; color: var(--accent); letter-spacing: -0.04em; }
    .nf h1 { font-size: clamp(1.4rem, 4vw, 2rem); margin: 0.6rem 0 0.9rem; }
    .nf p { color: var(--muted); margin: 0 auto 2rem; }
  </style>
</head>
<body>
  <main class="nf">
    <div class="nf-inner">
      <div class="nf-code">404</div>
      <h1>Siden findes ikke</h1>
      <p>Linket er måske flyttet eller skrevet forkert. Lad os få dig tilbage på sporet.</p>
      <a href="/" class="btn btn-primary">Til forsiden <span class="arrow">→</span></a>
    </div>
  </main>
</body>
</html>
