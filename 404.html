<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, follow" />
  <title>404 · Nordcode</title>
  <meta name="theme-color" content="#0a0f0d" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/styles.css" />
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='16' fill='%230a0f0d'/%3E%3Crect x='6' y='6' width='88' height='88' rx='12' fill='none' stroke='%236cf7a0' stroke-width='4'/%3E%3Cpath d='M30 70V32h7l26 26V32h7v38h-7L37 44v26z' fill='%236cf7a0'/%3E%3C/svg%3E" />
  <style>
    .nf { min-height: 100vh; display: grid; place-items: center; text-align: center; padding: 2rem; }
    .nf-inner { max-width: 460px; }
    .nf-code { font-family: "JetBrains Mono", monospace; font-weight: 500; font-size: clamp(4rem, 18vw, 9rem); line-height: 1; color: var(--accent); letter-spacing: -0.03em; }
    .nf-cmd { font-family: "JetBrains Mono", monospace; color: var(--faint); font-size: 0.9rem; margin: 0.4rem 0 1.2rem; }
    .nf-cmd::before { content: "$ "; color: var(--accent); }
    .nf h1 { font-size: clamp(1.4rem, 4vw, 2rem); margin: 0 0 0.9rem; }
    .nf p { color: var(--muted); margin: 0 auto 2rem; }
  </style>
</head>
<body>
  <div class="grain" aria-hidden="true"></div>
  <main class="nf">
    <div class="nf-inner">
      <div class="nf-code">404</div>
      <p class="nf-cmd">cat side.html: no such file or directory</p>
      <h1>Siden findes ikke</h1>
      <p>Linket er måske flyttet eller skrevet forkert. Lad os få dig tilbage på sporet.</p>
      <a href="/" class="btn btn-primary">Til forsiden <span class="arrow">→</span></a>
    </div>
  </main>
</body>
</html>
